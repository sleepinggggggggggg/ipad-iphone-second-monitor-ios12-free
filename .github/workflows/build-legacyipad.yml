name: Build LegacyPadDisplay iOS 12 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/build-legacyipad.yml"

permissions:
  contents: read

jobs:
  build:
    # macOS 14 is the GitHub-hosted image that provides Xcode 15.4.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Adapt project format for Xcode 15.4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("iOS/LegacyPadDisplay.xcodeproj/project.pbxproj")
          text = path.read_text()
          for marker in ("objectVersion = 77;", "preferredProjectObjectVersion = 77;"):
              if marker not in text:
                  raise SystemExit(f"Expected project-format marker is missing: {marker}")
          text = text.replace("objectVersion = 77;", "objectVersion = 60;", 1)
          text = text.replace("preferredProjectObjectVersion = 77;", "preferredProjectObjectVersion = 60;", 1)
          path.write_text(text)
          PY
          grep -E 'objectVersion|preferredProjectObjectVersion' \
            iOS/LegacyPadDisplay.xcodeproj/project.pbxproj

      - name: Build unsigned app for iOS 12
        run: |
          set -o pipefail
          xcodebuild \
            -project iOS/LegacyPadDisplay.xcodeproj \
            -target LegacyPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/LegacyPadDisplayDerived/Build/Products/Release-iphoneos" \
            OBJROOT="$RUNNER_TEMP/LegacyPadDisplayDerived/Build/Intermediates.noindex" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify app and package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LegacyPadDisplayDerived/Build/Products/Release-iphoneos/LegacyPadDisplay.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/LegacyPadDisplay"

          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$MINIMUM_OS" = "12.0"
          echo "Verified MinimumOSVersion: $MINIMUM_OS"

          echo "===== Bundle ID ====="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "===== Architecture ====="
          lipo -info "$APP/LegacyPadDisplay"

          OUT="$RUNNER_TEMP/LegacyPadDisplayIPA"
          IPA="$GITHUB_WORKSPACE/LegacyPadDisplay-unsigned.ipa"
          mkdir -p "$OUT/Payload"
          ditto "$APP" "$OUT/Payload/LegacyPadDisplay.app"
          (cd "$OUT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          /usr/bin/unzip -t "$IPA"
          /usr/bin/unzip -Z1 "$IPA" | grep -Fxq 'Payload/LegacyPadDisplay.app/Info.plist'
          /usr/bin/unzip -Z1 "$IPA" | grep -Fxq 'Payload/LegacyPadDisplay.app/LegacyPadDisplay'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-unsigned-ipa
          path: LegacyPadDisplay-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
